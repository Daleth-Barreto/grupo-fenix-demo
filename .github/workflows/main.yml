name: Flujo Automático de Pull Requests

on:
  push:
    branches:
      - test
      - dev

jobs:
  manage-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # BLOQUE 1: Si el cambio fue en 'test', hace PR a 'dev'
      - name: PR de Test a Dev
        if: github.ref == 'refs/heads/test'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "test"
          destination_branch: "dev"
          pr_title: "Automated PR: Cambios detectados en Test"
          pr_body: "PR automático generado tras un cambio en la rama test."
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # BLOQUE 2: Si el cambio fue en 'dev', hace PR a 'main'
      - name: PR de Dev a Main
        if: github.ref == 'refs/heads/dev'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "dev"
          destination_branch: "main"
          pr_title: "Automated PR: Despliegue de Dev a Main"
          pr_body: "PR automático generado tras consolidar cambios en la rama dev."
          github_token: ${{ secrets.GITHUB_TOKEN }}
